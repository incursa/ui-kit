name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    # Playwright 1.58 does not provide Chromium dependencies for Ubuntu 26.04.
    # Pin the supported LTS runner so conformance installation is deterministic.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify

      - name: Install conformance browser
        run: npx playwright install --with-deps chromium

      - name: Run reusable shell conformance
        run: npm run test:conformance
