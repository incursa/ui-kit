name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Playwright 1.58 does not provide Chromium dependencies for Ubuntu 26.04.
    # Pin the supported LTS runner so conformance installation is deterministic.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin candidate pack toolchain
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify

      - name: Install conformance browser
        run: npx playwright install --with-deps chromium

      - name: Run reusable shell conformance
        run: npm run test:conformance

      - name: Run full browser suite
        run: npm run test:browser

      - name: Produce immutable non-production candidate
        run: npm run package:candidate

      - name: Retain exact non-production candidate
        uses: actions/upload-artifact@v4
        with:
          name: ui-kit-1.10.0-pf-m3.3.1-${{ github.sha }}
          path: .artifacts/ui-kit-candidate/
          if-no-files-found: error
          retention-days: 90
